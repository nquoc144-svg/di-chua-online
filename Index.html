document.getElementById('jump').onclick=()=>{if(running&&player.position.y<=.02)jumpVelocity=6};

window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
action.addEventListener('click',()=>{prayer=true;notice.style.display='block';notice.textContent='🙏 Bạn chắp tay lễ Phật. Nguyện tâm an, lòng thiện.';setTimeout(()=>{prayer=false;notice.style.display='none'},2600)});
document.getElementById('punch').addEventListener('click',()=>attack('punch'));document.getElementById('slap').addEventListener('click',()=>attack('slap'));document.getElementById('pinch').addEventListener('click',()=>attack('pinch'));document.getElementById('matcha').addEventListener('click',healMatcha);document.getElementById('invite').addEventListener('click',inviteLate);
document.getElementById('pickQuoc').addEventListener('click',()=>{selected='Quốc';document.getElementById('pickQuoc').classList.add('selected');document.getElementById('pickTuyet').classList.remove('selected')});document.getElementById('pickTuyet').addEventListener('click',()=>{selected='Tuyết';document.getElementById('pickTuyet').classList.add('selected');document.getElementById('pickQuoc').classList.remove('selected')});
function start(){startScreen.style.display='none';controls.style.display='block';document.getElementById('extra').style.display='flex';lookpad.style.display='block';document.getElementById('actionbar').style.display='flex';document.getElementById('health').style.display='block';document.getElementById('healthlabel').style.display='block';selectedName=selected;const playerNew=makeCharacter(selected,selected==='Tuyết'?'female':'male',selected==='Tuyết'?0xc17b9c:0x8b6545);while(player.children.length)player.remove(player.children[0]);player.add(...playerNew.children);player.userData=playerNew.userData;const partnerName=selected==='Tuyết'?'Quốc':'Tuyết';const partnerNew=makeCharacter(partnerName,partnerName==='Tuyết'?'female':'male',partnerName==='Tuyết'?0xc17b9c:0x8b6545);while(partner.children.length)partner.remove(partner.children[0]);partner.add(...partnerNew.children);partner.userData=partnerNew.userData;player.position.set(0,0,16);partner.position.set(1.6,0,13.7);partnerHome=partner.position.clone();running=true;updateHealth();renderer.setAnimationLoop(animate)}document.getElementById('play').addEventListener('click',start);
function animate(){if(!running)return;let dt=Math.min(clock.getDelta(),.04);let x=joy.x,y=joy.y;if(keys.w||keys.arrowup)y=Math.max(y,1);if(keys.s||keys.arrowdown)y=Math.min(y,-1);if(keys.a||keys.arrowleft)x=Math.min(x,-1);if(keys.d||keys.arrowright)x=Math.max(x,1);
let mag=Math.hypot(x,y);if(mag>.12){let f=Math.max(-1,Math.min(1,y)),side=Math.max(-1,Math.min(1,x));let speed=4.0;let forward=new THREE.Vector3(Math.sin(cameraYaw),0,Math.cos(cameraYaw));let right=new THREE.Vector3(Math.cos(cameraYaw),0,-Math.sin(cameraYaw));player.position.addScaledVector(forward,-f*speed*dt);player.position.addScaledVector(right,side*speed*dt);yaw=cameraYaw;walkPhase+=dt*9*Math.min(1,mag);player.userData.legs[0].rotation.x=Math.sin(walkPhase)*.65*mag;player.userData.legs[1].rotation.x=-Math.sin(walkPhase)*.65*mag;player.userData.arms[0].rotation.x=-Math.sin(walkPhase)*.45*mag;player.userData.arms[1].rotation.x=Math.sin(walkPhase)*.45*mag;player.rotation.y=yaw;}else{player.userData.legs.forEach(l=>l.rotation.x*=.78);player.userData.arms.forEach(a=>a.rotation.x*=.78)}
if(attackState){attackState.time+=dt;const t=attackState.time;const armL=player.userData.arms[0],armR=player.userData.arms[1];if(attackState.type==='punch'){armR.rotation.x=-Math.max(0,Math.sin(Math.min(1,t/.22)*Math.PI))*1.35;armR.rotation.z=-.12;}else if(attackState.type==='slap'){armR.rotation.x=-.25;armR.rotation.z=-Math.max(0,Math.sin(Math.min(1,t/.2)*Math.PI))*1.25;}else{armR.rotation.x=-.45;armL.rotation.x=-.45;}if(t>.42){attackState=null;player.userData.arms.forEach(a=>{a.rotation.x=0;a.rotation.z=0});}}
player.position.x=THREE.MathUtils.clamp(player.position.x,-42,42);player.position.z=THREE.MathUtils.clamp(player.position.z,-40,35);
partnerTimer=Math.max(0,partnerTimer-dt);if(partnerMode==='punch'&&partnerTimer>0){let vel=partner.userData.hitVelocity||new THREE.Vector3();partner.position.addScaledVector(vel,dt);vel.y-=9.8*dt;if(partner.position.y<=0){partner.position.y=0;vel.y=0;partnerMode='idle';}}
else if(partnerMode==='slap'&&partnerTimer>0){partner.rotation.z=Math.sin((2.1-partnerTimer)*Math.PI/2)*1.35;partner.position.y=Math.max(0,.1*Math.sin((2.1-partnerTimer)*Math.PI));}
else if(partnerMode==='pinch'&&partnerTimer>0){partner.visible=false;}
else if(partnerMode!=='idle'){partner.visible=true;partner.rotation.z=0;partner.position.y=0;partner.position.lerp(partnerHome,Math.min(1,dt*2.4));partnerMode='idle';partner.userData.hitVelocity=new THREE.Vector3();partner.userData.respawn=false;showNotice('✨ '+partner.userData.name+' đã hồi sinh!');}
if(partnerMode==='idle'){partner.visible=true;partner.position.y=0;partner.position.lerp(partnerHome,Math.min(1,dt*.7));let d=player.position.clone().sub(partner.position);if(d.length()>1.2)partner.rotation.y=Math.atan2(d.x,d.z);partner.userData.legs.forEach((l,i)=>l.rotation.x=Math.sin(clock.elapsedTime*2+i*Math.PI)*.12);}
if(jumpVelocity!==0||player.position.y>0){player.position.y+=jumpVelocity*dt;jumpVelocity-=15*dt;if(player.position.y<0){player.position.y=0;jumpVelocity=0}}const dogTarget=mounted?player.position.clone().add(new THREE.Vector3(0,-.55,0)):player.position.clone().add(new THREE.Vector3(-1.2,0,1.1));dog.position.lerp(dogTarget,Math.min(1,dt*5));dog.rotation.y=player.rotation.y;dog.scale.setScalar(mounted?1.45:1);if(mounted)player.position.y=Math.max(player.position.y,.78);
let back=new THREE.Vector3(Math.sin(cameraYaw)*cameraDistance,Math.sin(cameraPitch)*cameraDistance+1.2,Math.cos(cameraYaw)*cameraDistance);let desired=player.position.clone().add(back);camera.position.lerp(desired,1-Math.pow(.001,dt));let look=player.position.clone();look.y+=1.5;camera.lookAt(look);
let dist=player.position.distanceTo(new THREE.Vector3(0,0,-11));action.style.display=dist<9?'block':'none';if(peerConn&&peerConn.open&&clock.elapsedTime-lastNetSend>.05){lastNetSend=clock.elapsedTime;peerConn.send({x:player.position.x,y:player.position.y,z:player.position.z,r:player.rotation.y})}renderer.render(scene,camera)}
// Kết nối hai người qua PeerJS. Người chơi chia sẻ mã phòng cho bạn bè.
let peer=null,peerConn=null,remotePlayer=null,lastNetSend=0;
function setupRemote(){if(remotePlayer)return;remotePlayer=makeCharacter('Bạn','male',0x4d8ca8);scene.add(remotePlayer);remotePlayer.visible=false}
function startOnline(){if(!window.Peer){const sc=document.createElement('script');sc.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';sc.onload=initPeer;sc.onerror=()=>showNotice('Không tải được thư viện online. Hãy kiểm tra internet.');document.head.appendChild(sc)}else initPeer()}
function initPeer(){if(peer)return;peer=new Peer();peer.on('open',id=>{const host=confirm('Tạo phòng mới? OK = tạo phòng, Cancel = vào phòng bạn bè.');if(host){showNotice('Mã phòng: '+id+' — gửi mã này cho bạn bè',8000);setupRemote()}else{const id2=prompt('Nhập mã phòng bạn bè:');if(id2){peerConn=peer.connect(id2);wireConnection()}}});peer.on('connection',c=>{peerConn=c;wireConnection()});peer.on('error',e=>showNotice('Lỗi kết nối: '+e.type))}
function wireConnection(){setupRemote();peerConn.on('open',()=>showNotice('🌐 Đã kết nối người chơi thứ 2!'));peerConn.on('data',d=>{if(remotePlayer){remotePlayer.visible=true;remotePlayer.position.set(d.x,d.y,d.z);remotePlayer.rotation.y=d.r}});peerConn.on('close',()=>{if(remotePlayer)remotePlayer.visible=false;showNotice('Bạn bè đã ngắt kết nối')})}
document.getElementById('online').onclick=startOnline;

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
// initial camera position
camera.position.set(0,4,23);camera.lookAt(0,1,16);
</script>
